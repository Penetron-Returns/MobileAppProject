name: Test on Pull Request

on:
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Run Lint and Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # npm workspaces: one install at the root covers apps/mobile and the packages (apps/api has its own lockfile, see the api job)
      - run: npm ci
      - run: npm run lint -w apps/mobile
      - run: npm run lint -w packages/ui
      - run: npm run typecheck -w apps/mobile
      - run: npm run typecheck -w packages/ui
      - run: npm run test:no-watch -w apps/mobile -- --ci --coverage
      - run: npx expo export --platform web --output-dir /tmp/export-web
        working-directory: apps/mobile

  backend:
    name: Backend and Edge Function
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run check:edge
      - run: npm run test:edge

  database:
    name: Database migrations and SQL tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run SQL test suite against a throwaway Postgres 16
        run: PG_BIN=/usr/lib/postgresql/16/bin scripts/db/test.sh
